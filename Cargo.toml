[package]
name = "pwrde"
version = "0.1.0"
edition = "2024"

[dependencies]
# wezterm-term isn't published to crates.io; pull it (and termwiz, so the
# cell/color types are the same version) from the wezterm repo.
wezterm-term = { git = "https://github.com/wezterm/wezterm", branch = "main" }
termwiz = { git = "https://github.com/wezterm/wezterm", branch = "main" }
# gpui — Zed's UI framework — is the sole renderer + windowing layer. Not on
# crates.io; pull it from the zed repo pinned to a rev for reproducibility.
# NB: no `rev` here on purpose. gpui-component depends on gpui with a *bare*
# (default-branch) git spec; a `rev` here would be a different SourceId and give
# us two incompatible copies of gpui (whose Window/App types wouldn't unify
# across the crate boundary). Leaving both bare collapses them onto one graph
# node, and Cargo.lock pins the exact commit reproducibly — see the pinned rev
# in Cargo.lock (kept at zed cc053a4, ~90 min from the old 027cf0d pin, so the
# gpui API still matches this codebase). Re-pin with:
#   cargo update -p gpui --precise <sha> && cargo update -p gpui_platform --precise <sha>
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
unicode-segmentation = "1"
# Syntax highlighting for the PR / local-diff viewers. Pure-Rust regex engine
# (fancy-regex) so there's no C `onig` build under sccache; `default-fancy`
# bundles the default syntax + theme sets.
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
# CommonMark parser for rendering PR / comment markdown. default-features off
# drops the HTML renderer and CLI getopts we don't use — we walk events directly.
pulldown-cmark = { version = "0.12", default-features = false }
# gpui-component (longbridge) — shadcn-ish gpui widget library, used by the
# experimental Notes page for markdown rendering (`text::markdown` -> TextView)
# and the note editor (`input::{InputState, TextInput}` in multi-line mode).
# Pinned to a commit whose Cargo.lock locks gpui at rev cc053a4 — ~90 minutes
# before pwrde's old 027cf0d pin, so the gpui API lines up. The `[patch]` below
# forces gpui-component's *bare* (default-branch) gpui dep onto the same rev so
# the whole graph resolves to ONE gpui — otherwise gpui's Window/App types would
# not unify across the crate boundary and nothing would compile.
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "f3ba893bd6a996ab0699266ba774b5bbb7f0ca1c" }

# Native-only. The wasm32 build under `web/` compiles this library without
# these — it brings its own gpui platform (gpui_web) and, for now, stubs the
# rest (see `docs/web-build.md` for what each is replaced with):
#   gpui_platform  — current_platform() for the macOS window (`app::run_native`).
#                    `font-kit` is REQUIRED: without it gpui_macos installs
#                    gpui::NoopTextSystem and NO glyphs render (quads still do).
#   portable-pty   — the kernel PTY behind every `term::Session`.
#   arboard        — system clipboard (`clipboard` module).
#   rusqlite       — session persistence (`persist` module).
#   libc           — `localtime_r` for the sidebar's wall-clock day buckets.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["font-kit"] }
portable-pty = "0.9.0"
arboard = "3.6.1"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"

# Both already in gpui's dependency tree at these versions; used to reach the
# NSWindow and hide AppKit's titlebar top-highlight hairline (see app.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"

# wasm32-unknown-unknown has no ambient randomness: crates deep in the wezterm
# tree (uuid via wezterm-blob-leases) need the browser backend named here, and
# `web/.cargo/config.toml` sets the matching `--cfg getrandom_backend="wasm_js"`.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

# objc 0.2's msg_send! probes `feature = "cargo-clippy"` inside its expansion,
# which rustc's check-cfg would flag at every call site. Registering the value
# keeps the lint quiet there while still catching genuinely unknown cfgs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

# Perf: fat LTO + single codegen unit for release builds — meaningful wins in
# the hot glyph/grid paths, same tricks Alacritty ships with.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# Keep dev builds usable: optimize dependencies (wgpu, cosmic-text shaping)
# even in debug so the terminal is snappy during development.
[profile.dev.package."*"]
opt-level = 2
