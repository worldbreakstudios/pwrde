[package]
name = "pwrde"
version = "0.1.0"
edition = "2024"

[dependencies]
glyphon = "0.12.0"
wgpu = "30.0.0"
winit = "0.30.13"
pollster = "0.4"
portable-pty = "0.9.0"
# wezterm-term isn't published to crates.io; pull it (and termwiz, so the
# cell/color types are the same version) from the wezterm repo.
wezterm-term = { git = "https://github.com/wezterm/wezterm", branch = "main" }
termwiz = { git = "https://github.com/wezterm/wezterm", branch = "main" }
bytemuck = { version = "1.25.2", features = ["derive"] }
# gpui — Zed's UI framework — is the sole renderer + windowing layer. Not on
# crates.io; pulled from the zed repo. NOTE: declared without a rev so cargo
# unifies it with gpui-component's identical spec (a `rev =` dep and a branch
# dep never unify → two gpui copies → type mismatches). The actual commit is
# pinned in Cargo.lock (`cargo update -p gpui --precise <sha>`); keep it at the
# same rev gpui-component's own lockfile uses.
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
# The platform layer was split into gpui_platform; current_platform() builds the
# real macOS platform to hand to Application::with_platform (as in zed's own main).
# `font-kit` is REQUIRED: without it gpui_macos installs gpui::NoopTextSystem and
# NO glyphs render (quads still do). With it we get the real CoreText MacTextSystem.
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["font-kit"] }
# Longbridge's component library on top of gpui (buttons, inputs, modals, tabs,
# sidebar, theming). Pinned to a rev whose lockfile matches the gpui rev above.
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "6d7847e33ef3b8e043d1fcea82eb7e1b7f919d8b" }
# Embedded SVG icons for gpui-component's IconName; registered via with_assets.
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "6d7847e33ef3b8e043d1fcea82eb7e1b7f919d8b" }
arboard = "3.6.1"
# Both already in gpui's dependency tree at these versions; used to reach the
# NSWindow and hide AppKit's titlebar top-highlight hairline (see main.rs).
objc = "0.2"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }

# objc 0.2's msg_send! probes `feature = "cargo-clippy"` inside its expansion,
# which rustc's check-cfg would flag at every call site. Registering the value
# keeps the lint quiet there while still catching genuinely unknown cfgs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

# Perf: fat LTO + single codegen unit for release builds — meaningful wins in
# the hot glyph/grid paths, same tricks Alacritty ships with.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# Keep dev builds usable: optimize dependencies (wgpu, cosmic-text shaping)
# even in debug so the terminal is snappy during development.
[profile.dev.package."*"]
opt-level = 2
